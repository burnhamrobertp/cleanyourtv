plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome.posters'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome.posters'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the same debug key as the launcher: the provider only answers apps signed like itself.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
